name: Publish release

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          APP="$(Scripts/build.sh release | tail -n 1)"
          Scripts/package-release.sh "$APP"
      - name: Read release version
        id: release
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"
      - name: Publish DMG, ZIP and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AirStats ${{ steps.release.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/AirStats-zh-CN-v${{ steps.release.outputs.version }}-macOS-arm64.dmg
            dist/AirStats-zh-CN-v${{ steps.release.outputs.version }}-macOS-arm64.zip
            dist/SHA256SUMS-v${{ steps.release.outputs.version }}.txt
          fail_on_unmatched_files: true
